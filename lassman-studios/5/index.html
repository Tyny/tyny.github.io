<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lassman Studios — Option 5</title>
<meta name="description" content="Option 5 — design direction to be defined.">
<style>
  :root { --bg:#f4f1ea; --ink:#1c1a17; --muted:#6b655c; --line:#e5ded1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14120f; --ink:#f2ede4; --muted:#a39b8d; --line:#302b23; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:40px 20px; gap:14px;
  }
  .eyebrow { font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0; }
  h1 { font-size:28px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  p.lead { color:var(--muted); margin:0; max-width:48ch; }
  a.back { margin-top:10px; color:var(--muted); font-size:13px; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; }
  a.back:hover { color:var(--ink); }
</style>
</head>
<body>
  <p class="eyebrow">Lassman Studios</p>
  <h1>Option 5</h1>
  <p class="lead">This direction is coming soon.</p>
  <a class="back" href="../">&larr; Back to all directions</a>
</body>
</html>
