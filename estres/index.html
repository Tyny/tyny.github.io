<!doctype html>
<html lang="es">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estres — Tyny</title>
<meta name="description" content="Estres — cinco conformaciones del isotipo, cada una con nombre de constelación.">
<link rel="stylesheet" href="../dots.css">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1c1a17; --muted: #6b655c;
    --line: #e5ded1; --pc: #c26a1c;
    --reserve: 412px;            /* room the title block needs below the logo */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --card: #1e1b17; --ink: #f2ede4; --muted: #a39b8d;
      --line: #302b23; --pc: #e0954e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  /* wide enough that a square logo is never width-bound before it reaches 80vh */
  .wrap { width: 100%; max-width: 1200px; }
  /* the lede wraps to more lines on narrow screens, so it needs more room */
  @media (max-width: 620px) { :root { --reserve: 496px; } }

  /* The stage is the tap target: anywhere on it advances to the next version. */
  .stage {
    display: block; width: 100%; border: 0; background: none; padding: 10px 0;
    color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .stage:focus-visible { outline: 3px solid var(--pc); outline-offset: 6px; border-radius: 12px; }
  .frames { display: grid; place-items: center; }
  .frames svg {
    grid-area: 1 / 1;            /* all three stack, only one is shown */
    display: block; width: auto; height: 80vh; max-width: 100%;
    max-height: calc(100vh - var(--reserve));
    max-height: calc(100dvh - var(--reserve));
    color: var(--ink);
    opacity: 0; visibility: hidden; transition: opacity .28s ease;
  }
  .frames svg.is-on { opacity: 1; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .frames svg { transition: none; } }

  /* text stays a readable column even though the stage is wide */
  .switcher, h1, .lede { max-width: 620px; }
  .switcher { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .pip {
    width: 9px; height: 9px; padding: 0; border-radius: 50%;
    border: 1px solid var(--muted); background: none; cursor: pointer;
  }
  .pip[aria-current="true"] { background: var(--pc); border-color: var(--pc); }
  .pip:focus-visible { outline: 2px solid var(--pc); outline-offset: 3px; }
  .hint { color: var(--muted); font-size: .85rem; margin-left: 4px; }

  .conste {
    margin: 0 0 6px; font-size: 1.05rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--pc);
  }
  h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; margin: 18px 0 0; }
  h1 .dot { color: var(--pc); }
  .lede { color: var(--muted); margin: 8px 0 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

<script>
(function () {
  var NAMES = ["Orión", "Corona Austral", "Triángulo Austral", "Retículo"];
  var svgs = Array.prototype.slice.call(document.querySelectorAll("#frames svg"));
  var pips = Array.prototype.slice.call(document.querySelectorAll(".pip"));
  var conste = document.getElementById("conste");
  var live = document.getElementById("live");
  var i = 0;

  function show(n) {
    i = (n + svgs.length) % svgs.length;
    svgs.forEach(function (s, k) { s.classList.toggle("is-on", k === i); });
    pips.forEach(function (p, k) { p.setAttribute("aria-current", k === i ? "true" : "false"); });
    conste.textContent = NAMES[i];
    meetRange.value = "1";
    applyAll();
    live.textContent = "Conformación " + (i + 1) + " de " + svgs.length + ": " + conste.textContent;
  }

  document.getElementById("stage").addEventListener("click", function () { show(i + 1); });

  pips.forEach(function (p) {
    p.addEventListener("click", function (e) {
      e.stopPropagation();
      show(parseInt(p.dataset.go, 10));
    });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { show(i + 1); }
    else if (e.key === "ArrowLeft") { show(i - 1); }
  });

  // Horizontal swipe also moves between versions on touch devices.
  var x0 = null;
  var stage = document.getElementById("stage");
  stage.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (x0 === null) { return; }
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) { show(dx < 0 ? i + 1 : i - 1); }
    x0 = null;
  }, { passive: true });

  // --- meeting factor -----------------------------------------------------
  // Every arrangement is three triangles displaced from the figure's centre.
  // Scaling those displacements is the general form of "how much they meet":
  // k = 1 is the arrangement as authored, k = 0 collapses all three onto the
  // centre. Each triangle carries its own displacement, so this works for all
  // four — Corona Austral barely moves because its three are already
  // concentric, which is the honest answer rather than a special case.
  var meet = document.getElementById("meet");
  var meetRange = document.getElementById("meet-range");
  var meetOut = document.getElementById("meet-out");

  function tableFor(svg, attr) {
    var raw = svg.getAttribute(attr);
    if (!raw) { return []; }
    return raw.split(";").map(function (e) {
      var p = e.split(",");
      return [parseFloat(p[0]), p.length > 1 && isNaN(parseFloat(p[1])) ? p[1] : parseFloat(p[1])];
    });
  }

  // Rotating swings corners outward, so the factor has to be capped tighter as
  // the angle grows or the mark spills past the ring. Sampled next to the
  // geometry, interpolated here.
  function kmaxFor(svg, phi) {
    var t = tableFor(svg, "data-ktable"), a = Math.abs(phi);
    if (!t.length) { return 2; }
    for (var k = 0; k < t.length - 1; k++) {
      if (a <= t[k + 1][0]) {
        var f = (a - t[k][0]) / (t[k + 1][0] - t[k][0]);
        return t[k][1] + f * (t[k + 1][1] - t[k][1]);
      }
    }
    return t[t.length - 1][1];
  }

  function applyAll() {
    var phi = parseFloat(rotRange.value);
    var svg = svgs[i];
    var lim = kmaxFor(svg, phi);
    meetRange.max = lim.toFixed(3);
    if (parseFloat(meetRange.value) > lim) { meetRange.value = String(lim); }
    var k = parseFloat(meetRange.value);
    var gs = svg.querySelectorAll(".tri");
    for (var n = 0; n < gs.length; n++) {
      var cx = parseFloat(gs[n].getAttribute("data-cx"));
      var cy = parseFloat(gs[n].getAttribute("data-cy"));
      var vx = parseFloat(gs[n].getAttribute("data-vx"));
      var vy = parseFloat(gs[n].getAttribute("data-vy"));
      gs[n].setAttribute("transform",
        "translate(" + ((k - 1) * vx).toFixed(3) + "," + ((k - 1) * vy).toFixed(3) + ") " +
        "rotate(" + phi.toFixed(3) + "," + cx + "," + cy + ")");
    }
    rotOut.textContent = phi.toFixed(1) + "\u00b0";
    var marks = tableFor(svg, "data-kmarks");
    var hit = null;
    for (var m = 0; m < marks.length; m++) {
      if (Math.abs(marks[m][0] - k) < 0.006 && Math.abs(phi) < 0.13) { hit = marks[m][1]; }
    }
    meetOut.textContent = hit || k.toFixed(2);
    if (hit) { conste.textContent = hit; }
    else if (marks.length) { conste.textContent = NAMES[i] + " ·"; }
  }

  rotRange.value = "0";
  meetRange.addEventListener("input", applyAll);
  rotRange.addEventListener("input", applyAll);

  show(0);
})();
</script>
