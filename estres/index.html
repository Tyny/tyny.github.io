<link rel="stylesheet" href="../dots.css">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1c1a17; --muted: #6b655c;
    --line: #e5ded1; --pc: #c26a1c;
    --reserve: 340px;            /* room the title block needs below the logo */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --card: #1e1b17; --ink: #f2ede4; --muted: #a39b8d;
      --line: #302b23; --pc: #e0954e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  /* wide enough that a square logo is never width-bound before it reaches 80vh */
  .wrap { width: 100%; max-width: 1200px; }
  /* the lede wraps to more lines on narrow screens, so it needs more room */
  @media (max-width: 620px) { :root { --reserve: 390px; } }

  /* The stage is the tap target: anywhere on it advances to the next version. */
  .stage {
    display: block; width: 100%; border: 0; background: none; padding: 10px 0;
    color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .stage:focus-visible { outline: 3px solid var(--pc); outline-offset: 6px; border-radius: 12px; }
  .frames { display: grid; place-items: center; }
  .frames svg {
    grid-area: 1 / 1;            /* all three stack, only one is shown */
    display: block; width: auto; height: 80vh; max-width: 100%;
    max-height: calc(100vh - var(--reserve));
    max-height: calc(100dvh - var(--reserve));
    color: var(--ink);
    opacity: 0; visibility: hidden; transition: opacity .28s ease;
  }
  .frames svg.is-on { opacity: 1; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .frames svg { transition: none; } }

  /* text stays a readable column even though the stage is wide */
  .switcher, h1, .lede { max-width: 620px; }
  .switcher { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .pip {
    width: 9px; height: 9px; padding: 0; border-radius: 50%;
    border: 1px solid var(--muted); background: none; cursor: pointer;
  }
  .pip[aria-current="true"] { background: var(--pc); border-color: var(--pc); }
  .pip:focus-visible { outline: 2px solid var(--pc); outline-offset: 3px; }
  .hint { color: var(--muted); font-size: .85rem; margin-left: 4px; }

  .conste {
    margin: 0 0 6px; font-size: 1.05rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--pc);
  }
  h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; margin: 18px 0 0; }
  h1 .dot { color: var(--pc); }
  .lede { color: var(--muted); margin: 8px 0 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

<script>
(function () {
  var NAMES = ["Orión", "Corona Austral", "Triángulo Austral", "Pavo", "Retículo"];
  var svgs = Array.prototype.slice.call(document.querySelectorAll("#frames svg"));
  var pips = Array.prototype.slice.call(document.querySelectorAll(".pip"));
  var conste = document.getElementById("conste");
  var live = document.getElementById("live");
  var i = 0;

  function show(n) {
    i = (n + svgs.length) % svgs.length;
    svgs.forEach(function (s, k) { s.classList.toggle("is-on", k === i); });
    pips.forEach(function (p, k) { p.setAttribute("aria-current", k === i ? "true" : "false"); });
    conste.textContent = NAMES[i];
    live.textContent = "Versión " + (i + 1) + " de " + svgs.length + ": " + NAMES[i];
  }

  document.getElementById("stage").addEventListener("click", function () { show(i + 1); });

  pips.forEach(function (p) {
    p.addEventListener("click", function (e) {
      e.stopPropagation();
      show(parseInt(p.dataset.go, 10));
    });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { show(i + 1); }
    else if (e.key === "ArrowLeft") { show(i - 1); }
  });

  // Horizontal swipe also moves between versions on touch devices.
  var x0 = null;
  var stage = document.getElementById("stage");
  stage.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (x0 === null) { return; }
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) { show(dx < 0 ? i + 1 : i - 1); }
    x0 = null;
  }, { passive: true });

  show(0);
})();
</script>
