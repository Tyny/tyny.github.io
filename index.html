<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyny — Proyectos</title>
<meta name="description" content="Proyectos de Tyny: Mercado Meliquina y Chromatic Circle.">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1c1a17; --muted: #6b655c;
    --line: #e5ded1; --accent: #c26a1c; --accent2: #7a4fb8;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --card: #1e1b17; --ink: #f2ede4; --muted: #a39b8d;
      --line: #302b23; --accent: #e0954e; --accent2: #b28ee0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 40px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 780px; }
  header { margin-bottom: 34px; }
  .brand { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; margin: 0; }
  .brand .dot { color: var(--accent); }
  .tagline { color: var(--muted); margin: 8px 0 0; font-size: 1.05rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .proj {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 24px 22px 22px; text-decoration: none; color: inherit;
    box-shadow: var(--shadow); transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    position: relative; overflow: hidden;
  }
  .proj::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--pc); }
  .proj:hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0,0,0,.08), 0 18px 50px rgba(0,0,0,.12); border-color: var(--pc); }
  .proj:focus-visible { outline: 3px solid var(--pc); outline-offset: 3px; }
  .m { --pc: var(--accent); }
  .c { --pc: var(--accent2); }
  .p-emoji { font-size: 1.9rem; }
  .p-name { font-size: 1.35rem; font-weight: 800; letter-spacing: -.01em; }
  .p-desc { color: var(--muted); font-size: .96rem; margin: 0; }
  .p-go { margin-top: auto; padding-top: 10px; font-weight: 700; font-size: .9rem; color: var(--pc); display: inline-flex; align-items: center; gap: 6px; }
  .p-go .arrow { transition: transform .16s ease; }
  .proj:hover .p-go .arrow { transform: translateX(4px); }
  footer { margin-top: 30px; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">Tyny<span class="dot">.</span></h1>
      <p class="tagline">Cosas que voy construyendo. Elegí una:</p>
    </header>

    <div class="grid">
      <a class="proj m" href="./mercado-meliquina/">
        <span class="p-emoji">🛒</span>
        <span class="p-name">Mercado Meliquina</span>
        <p class="p-desc">Historias de usuario y mockup interactivo de un mercado de compra comunitaria en Villa Meliquina.</p>
        <span class="p-go">Abrir <span class="arrow">→</span></span>
      </a>

      <a class="proj c" href="./chromatic-circle/">
        <span class="p-emoji">🎵</span>
        <span class="p-name">Chromatic Circle</span>
        <p class="p-desc">Círculo cromático interactivo: doce semitonos, elegí la tónica y explorá.</p>
        <span class="p-go">Abrir <span class="arrow">→</span></span>
      </a>
    </div>

    <footer>
      <a href="https://github.com/Tyny">github.com/Tyny</a>
    </footer>
  </div>
</body>
</html>
