<title>Lawal — Tyny</title>

<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1c1a17; --muted: #6b655c;
    --line: #e5ded1; --pc: #dd5769;
    --reserve: 190px;            /* room the title needs below the logo */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --card: #1e1b17; --ink: #f2ede4; --muted: #a39b8d;
      --line: #302b23; --pc: #e2707f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  /* wide enough that the landscape mark is not width-bound before it hits 80vh */
  .wrap { width: 100%; max-width: 1200px; }
  .logo-slot { display: flex; align-items: center; justify-content: center; padding: 10px 0; }
  .logo-slot svg {
    display: block; width: auto; height: 80vh; max-width: 100%;
    max-height: calc(100vh - var(--reserve));
    max-height: calc(100dvh - var(--reserve));
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--pc) 40%, transparent));
  }
  h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; margin: 26px 0 0; max-width: 620px; }
  h1 .dot { color: var(--pc); }
</style>
</head>
