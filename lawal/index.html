<title>Lawal — Tyny</title>
<meta name="description" content="Lawal — el isotipo de la W, punto por punto.">
<link rel="stylesheet" href="../dots.css">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1c1a17; --muted: #6b655c;
    --line: #e5ded1; --pc: #dd5769;
    --reserve: 238px;            /* room the title needs below the logo */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --card: #1e1b17; --ink: #f2ede4; --muted: #a39b8d;
      --line: #302b23; --pc: #e2707f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  /* the mark is 1.6:1, so it needs a lot of width before 80vh of height binds */
  .wrap { width: 100%; max-width: 1900px; }
  .logo-slot { display: flex; align-items: center; justify-content: center; padding: 10px 0; }
  .logo-slot svg {
    display: block; width: auto; height: 80vh; max-width: 100%;
    max-height: calc(100vh - var(--reserve));
    max-height: calc(100dvh - var(--reserve));
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--pc) 40%, transparent));
  }
  h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; margin: 26px 0 0; max-width: 620px; }
  h1 .dot { color: var(--pc); }
</style>
</head>
