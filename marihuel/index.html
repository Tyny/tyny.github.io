<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marihuel — Tyny</title>
<meta name="description" content="Marihuel — te pone a bailar.">
<link rel="stylesheet" href="../dots.css">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1c1a17; --muted: #6b655c;
    --line: #e5ded1; --pc: #c2306e;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --card: #1e1b17; --ink: #f2ede4; --muted: #a39b8d;
      --line: #302b23; --pc: #ea86b0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 40px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 900px; }
  .logo-slot {
    display: flex; align-items: center; justify-content: center;
    padding: 10px 0;
  }
  .logo-slot svg {
    display: block; width: auto; height: 80vh; max-width: 100%;
    /* never taller than what is left once the title block is placed,
       so the page fits the viewport without scrolling */
    max-height: calc(100vh - 268px);
    max-height: calc(100dvh - 268px);
    color: var(--ink);
    filter: drop-shadow(0 0 8px color-mix(in srgb, var(--pc) 55%, transparent));
  }
  h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; margin: 26px 0 0; }
  h1 .dot { color: var(--pc); }
  .lede { color: var(--muted); margin: 8px 0 0; }
</style>
</head>
