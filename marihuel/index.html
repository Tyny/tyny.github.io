<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marihuel — Tyny</title>
<meta name="description" content="Marihuel — te pone a bailar.">
<style>
  :root {
    --bg0: #0a0710;      /* deep night */
    --bg1: #1a0d1e;      /* warm plum near the fish */
    --pink: #ff3d8a;
    --ink: #f6eef4;
    --muted: #b79fb4;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: var(--bg0); }
  body {
    /* 4 screens tall: the runway the camera walks down */
    height: 400vh;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* The window the fish is seen through. Stays put while the page scrolls. */
  .stage {
    position: sticky; top: 0;
    height: 100vh; width: 100%;
    overflow: hidden;
    /* spotlight: bright pool of light around the fish, night at the edges */
    background:
      radial-gradient(60% 45% at 50% 42%, #2a1530 0%, rgba(26,13,30,.6) 45%, rgba(10,7,16,0) 75%),
      radial-gradient(130% 90% at 50% 0%, #140a1a 0%, var(--bg0) 60%);
  }
  /* faint teal swirl, echoing the record behind the fish in the photo */
  .stage::before {
    content: ""; position: absolute; inset: -10%;
    background:
      radial-gradient(40% 30% at 38% 55%, rgba(39,194,194,.10), transparent 70%),
      radial-gradient(45% 35% at 66% 40%, rgba(194,48,110,.12), transparent 72%);
    pointer-events: none;
  }

  .world {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
    z-index: 2;              /* the fish sits in front of the logo */
  }

  /* 'La Marihuel' logo, glowing and blurred behind the fish, near the bottom.
     raised 5px from before (bottom: -8vh + 5px) */
  .logo-bg {
    position: absolute; left: 50%; bottom: calc(-8vh + 5px);
    transform: translateX(-50%);
    width: min(100vw, 1480px);
    z-index: 1; pointer-events: none;
  }
  .logo-bg img {
    position: absolute; left: 0; bottom: 0; width: 100%;
    display: block; mix-blend-mode: screen; user-select: none;
  }
  /* glow halo, grounded low so it melts up into the background */
  .logo-glow  {
    filter: blur(30px) saturate(1.35); opacity: .40;
    -webkit-mask-image: linear-gradient(to bottom, transparent 12%, #000 46%);
            mask-image: linear-gradient(to bottom, transparent 12%, #000 46%);
  }
  /* the readable logo; only its very top (flourishes/ghost) fades out */
  .logo-base  {
    filter: blur(4px)  saturate(1.15); opacity: .60;
    -webkit-mask-image: linear-gradient(to bottom, transparent 5%, #000 22%);
            mask-image: linear-gradient(to bottom, transparent 5%, #000 22%);
  }
  /* lower part blurs more, fading in from the middle down */
  .logo-lower {
    filter: blur(13px) saturate(1.25); opacity: .55;
    -webkit-mask-image: linear-gradient(to bottom, transparent 36%, #000 92%);
            mask-image: linear-gradient(to bottom, transparent 36%, #000 92%);
  }
  .world svg {
    display: block; width: 720.9px; height: 1000px;
    filter: drop-shadow(0 0 10px rgba(255,61,138,.35));
  }

  /* glowing station halos, drawn into an overlay group by the script */
  .halo {
    fill: none;
    stroke: #ff9ccb;
    stroke-width: 2.4;
    opacity: .0;
    filter: drop-shadow(0 0 5px #ff5aa0) drop-shadow(0 0 11px #ff3d8a);
    animation: pulse 2.6s ease-in-out infinite;
  }
  .halo.on { opacity: .9; stroke: #ffffff; animation-duration: 1.6s; }
  @keyframes pulse {
    0%, 100% { opacity: .28; }
    50%      { opacity: .75; }
  }
  /* make the station dot itself a touch brighter */
  .star-glow { filter: drop-shadow(0 0 4px #ffb3d6) drop-shadow(0 0 9px #ff3d8a); }

  /* clickable names on the eye / mouth / feet */
  .label { opacity: 0; transition: opacity .35s ease; cursor: pointer; }
  .label text {
    fill: #fff;
    font: 800 30px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    letter-spacing: -.01em;
    paint-order: stroke;
    stroke: rgba(8,5,12,.85); stroke-width: 6px; stroke-linejoin: round;
  }
  .label:hover text { fill: #ffd0e6; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .halo { animation: none; opacity: .5; }
  }

  /* quiet keyboard hint, bottom center */
  .hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center;
    color: var(--muted); font-size: .8rem; letter-spacing: .02em;
    background: rgba(10,7,16,.5); border: 1px solid rgba(255,255,255,.08);
    padding: 7px 14px; border-radius: 999px; backdrop-filter: blur(6px);
    z-index: 5; transition: opacity .6s; user-select: none;
  }
  .hint kbd {
    font: inherit; color: var(--ink);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    border-radius: 6px; padding: 1px 7px; line-height: 1.4;
  }
  .hint.faded { opacity: 0; }

  /* top bar: a flat dark band across the top, like the reference */
  .topbar {
    position: fixed; left: 0; top: 0; z-index: 4;
    width: 100%; height: 56px;
    display: flex; align-items: center;
    background: #190910;
    border-bottom: 1px solid rgba(255,255,255,.05);
    box-shadow: 0 2px 18px rgba(0,0,0,.45);
  }
  .wordmark {
    position: fixed; left: 26px; top: 0; z-index: 6;
    height: 56px; display: flex; align-items: center;
    font-weight: 800; letter-spacing: -.03em; font-size: 1.25rem;
    color: var(--ink);
  }
  .wordmark .dot { color: var(--pink); }
</style>
</head>

<script>
(function () {
  "use strict";
  var VB_W = 720.9, VB_H = 1000;
  var world = document.getElementById("world");
  var svg = document.getElementById("fish");
  var halosG = document.getElementById("halos");
  var hint = document.getElementById("hint");

  // geometry groups
  var linesG = svg.querySelector("g[stroke]");
  var dotsG  = svg.querySelector('g[fill]:not([stroke])');

  // --- contrast void -------------------------------------------------------
  // Morphological dilation of the line art: clone the dots/lines, grow them by
  // EXTRA px (stroke = Minkowski sum with a disc), paint them the background
  // color, and lay them BEHIND the colored fish. That carves a clean dark
  // margin around every dot and line so the fish stays legible over the logo.
  (function () {
    var EXTRA = 3;
    var vLines = linesG.cloneNode(true);
    vLines.removeAttribute("opacity");
    vLines.setAttribute("fill", "none");
    vLines.setAttribute("stroke", "#0a0710");
    vLines.setAttribute("stroke-width", String(1.6 + 2 * EXTRA));
    var vDots = dotsG.cloneNode(true);
    vDots.setAttribute("fill", "#0a0710");
    Array.prototype.forEach.call(vDots.querySelectorAll("circle"), function (c) {
      c.setAttribute("r", String((parseFloat(c.getAttribute("r")) || 1) + EXTRA));
    });
    svg.insertBefore(vDots, linesG);
    svg.insertBefore(vLines, linesG);
  })();

  // --- stations ---
  var SVGNS = "http://www.w3.org/2000/svg";
  var XLINK = "http://www.w3.org/1999/xlink";
  var circles = Array.prototype.slice.call(dotsG.querySelectorAll("circle"));
  var used = {};

  // snap a target point to the nearest circle not yet taken
  function snap(tx, ty) {
    var best = null, bestD = 1e9, bi = -1;
    circles.forEach(function (c, i) {
      if (used[i]) return;
      var x = parseFloat(c.getAttribute("cx")), y = parseFloat(c.getAttribute("cy"));
      var d = (x - tx) * (x - tx) + (y - ty) * (y - ty);
      if (d < bestD) { bestD = d; best = c; bi = i; }
    });
    if (!best) return null;
    used[bi] = true;
    best.classList.add("star-glow");
    return {
      x: parseFloat(best.getAttribute("cx")),
      y: parseFloat(best.getAttribute("cy")),
      r: parseFloat(best.getAttribute("r")) || 4
    };
  }

  var stations = [];

  // named, clickable parts of the fish (destinos provisorios)
  var NAMED = [
    { name: "Fotos",  href: "#fotos",  tx: 300, ty: 90  },  // el ojo
    { name: "Letras", href: "#letras", tx: 315, ty: 205 },  // la boca
    { name: "Fechas", href: "#fechas", tx: 300, ty: 960 }   // los pies
  ];
  NAMED.forEach(function (n) {
    var s = snap(n.tx, n.ty);
    if (s) { s.name = n.name; s.href = n.href; stations.push(s); }
  });

  // ambient glow stops that fill the body between the named ones
  [0.40, 0.52, 0.66].forEach(function (f) {
    var s = snap(VB_W / 2, f * VB_H);
    if (s) stations.push(s);
  });

  stations.sort(function (a, b) { return a.y - b.y; });

  // halos + labels for named stations
  var haloEls = [], labelEls = [];
  stations.forEach(function (s) {
    var el = document.createElementNS(SVGNS, "circle");
    el.setAttribute("cx", s.x); el.setAttribute("cy", s.y);
    el.setAttribute("r", Math.max(s.r * 4.5, 14));
    el.setAttribute("class", "halo");
    halosG.appendChild(el);
    haloEls.push(el);

    var lbl = null;
    if (s.name) {
      var a = document.createElementNS(SVGNS, "a");
      a.setAttribute("href", s.href);
      a.setAttributeNS(XLINK, "xlink:href", s.href);
      a.setAttribute("class", "label");
      var t = document.createElementNS(SVGNS, "text");
      t.setAttribute("x", s.x + Math.max(s.r * 3, 18));
      t.setAttribute("y", s.y + 9);
      t.textContent = s.name;
      a.appendChild(t);
      halosG.appendChild(a);
      lbl = a;
    }
    labelEls.push(lbl);
  });

  var TOP_Y = stations[0].y, BOT_Y = stations[stations.length - 1].y;
  var current = 0;
  var overview = /(^|[#&?])all(=|$|&)/.test(location.hash + location.search);

  function fitK() {
    var W = window.innerWidth, H = window.innerHeight;
    return Math.min(W / VB_W, H / VB_H);
  }
  function zoomK() {
    var narrow = window.innerWidth < 760;
    return fitK() * (narrow ? 1.8 : 2.35);
  }

  // Map scroll progress (0..1) to a focus Y that walks head -> feet.
  function focusYFromScroll() {
    var max = document.body.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    return TOP_Y + (BOT_Y - TOP_Y) * p;
  }

  function render() {
    var W = window.innerWidth, H = window.innerHeight;
    var k, fx = VB_W / 2, fy;
    if (overview) {
      k = fitK() * 0.9;
      fy = VB_H / 2;
    } else {
      k = zoomK();
      fy = focusYFromScroll();
    }
    var tx = W / 2 - k * fx;
    var ty = H / 2 - k * fy + 5;   // nudge the fish down 5px
    world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";

    // highlight the nearest station to the current focus
    if (!overview) {
      var nearest = 0, nd = 1e9;
      stations.forEach(function (s, i) {
        var d = Math.abs(s.y - fy);
        if (d < nd) { nd = d; nearest = i; }
      });
      current = nearest;
    }
    haloEls.forEach(function (el, i) {
      var on = i === current;              // active station, in either mode
      el.classList.toggle("on", on);
      if (labelEls[i]) {
        // zoomed: only the active name. overview: all names, active brightest.
        labelEls[i].style.opacity = overview ? (on ? "1" : "0.45") : (on ? "1" : "0");
        labelEls[i].classList.toggle("active", on);
      }
    });
  }

  function scrollToStation(i) {
    i = Math.max(0, Math.min(stations.length - 1, i));
    current = i;
    var frac = (stations[i].y - TOP_Y) / (BOT_Y - TOP_Y || 1);
    var max = document.body.scrollHeight - window.innerHeight;
    window.scrollTo({ top: frac * max, behavior: "smooth" });
  }

  var ticking = false;
  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function () { render(); ticking = false; });
    }
    fadeHint();
  }

  var hintTimer;
  function fadeHint() {
    hint.classList.remove("faded");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hint.classList.add("faded"); }, 3200);
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", render);

  function step(dir) {
    current = Math.max(0, Math.min(stations.length - 1, current + dir));
    if (overview) { render(); }      // stay zoomed out, just move the highlight
    else { scrollToStation(current); }
    fadeHint();
  }

  document.addEventListener("keydown", function (e) {
    if (e.repeat) return;   // one physical press = one action (clean toggle)
    if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault(); step(1);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault(); step(-1);
    } else if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      overview = !overview;
      if (!overview) { scrollToStation(current); }  // land on the chosen station
      render();   // always redraw: scrollTo above can be a no-op and never fire scroll
      fadeHint();
    }
  });

  render();
  fadeHint();
})();
</script>
</body>
</html>
